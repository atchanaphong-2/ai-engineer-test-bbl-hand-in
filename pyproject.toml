[tool.poetry]
name = "ai-engineer-test-bbl"
version = "0.1.0"
description = ""
authors = ["Atchanaphong <atchanaphong@ironbook.com>"]
packages = [{ include = "agentic_rag" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
langchain = ">=1.3.15,<2.0.0"
langgraph = ">=1.2.11,<2.0.0"
sentence-transformers = ">=5.7.0,<6.0.0"
faiss-cpu = ">=1.15.0,<2.0.0"
fastapi = ">=0.141.1,<0.142.0"
uvicorn = { version = ">=0.52.3,<0.53.0", extras = ["standard"] }
pydantic-settings = ">=2.15.0,<3.0.0"
numpy = ">=2.5.2,<3.0.0"
langchain-anthropic = "^1.5.6"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
ruff = ">=0.16.3,<0.17.0"
black = ">=26.5.1,<27.0.0"
httpx = ">=0.28.1,<0.29.0"
mypy = ">=2.3.1,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 95
target-version = ["py313"]

[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["agentic_rag", "main.py", "run.py"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
